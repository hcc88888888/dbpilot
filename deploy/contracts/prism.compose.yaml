services:
  prism:
    image: stoplight/prism:5.14.2
    command: mock /contracts/openapi/dbpilot-api.yaml --host 0.0.0.0 --port 4010
    volumes:
      - ../../contracts/openapi:/contracts/openapi:ro
      - ../../contracts/examples:/contracts/examples:ro
  gateway:
    image: nginx:1.27.5-alpine
    depends_on:
      - prism
    ports:
      - "4010:4010"
    command:
      - /bin/sh
      - -c
      - |
        printf '%s\n' 'server {' '  listen 4010;' '  location ~ ^/api/v1/tenants/[^/]+/projects/[^/]+/(.*)$$ {' '    rewrite ^/api/v1/tenants/[^/]+/projects/[^/]+/(.*)$$ /$$1 break;' '    proxy_pass http://prism:4010;' '  }' '}' > /etc/nginx/conf.d/default.conf
        nginx -g 'daemon off;'
