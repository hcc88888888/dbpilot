[Service]
# systemd 219 cannot grant ambient capabilities to a non-root identity. The
# legacy profile runs only this bounded helper as root and adds the procfs
# lookup capability needed by common CentOS 7 hidepid configurations.
User=root
Group=root
AmbientCapabilities=
CapabilityBoundingSet=CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
