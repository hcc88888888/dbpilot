PluginDefinitionsCollection:
  get:
    operationId: listPluginDefinitions
    summary: List database plugin definitions
    x-dbpilot-permission: plugins:view
    parameters:
      - name: database_family
        in: query
        schema: { $ref: ../common/discovery.yaml#/DatabaseFamily }
      - name: cursor
        in: query
        schema: { type: string, minLength: 1, maxLength: 512 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100 }
    responses:
      '200':
        description: Cursor-paginated plugin definitions.
        content:
          application/json:
            schema: { $ref: ../common/plugins.yaml#/PluginDefinitionPage }
      '400': { $ref: ../common/errors.yaml#/ProblemResponse }
      '401': { $ref: ../common/errors.yaml#/ProblemResponse }
      '403': { $ref: ../common/errors.yaml#/ProblemResponse }
      '405': { $ref: ../common/errors.yaml#/MethodNotAllowedProblemResponse }
PluginVersionsCollection:
  get:
    operationId: listPluginVersions
    summary: List immutable plugin versions
    x-dbpilot-permission: plugins:view
    parameters:
      - name: plugin_id
        in: query
        schema: { type: string, minLength: 1, maxLength: 128 }
      - name: status
        in: query
        schema: { $ref: ../common/plugins.yaml#/PluginVersionStatus }
      - name: cursor
        in: query
        schema: { type: string, minLength: 1, maxLength: 512 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100 }
    responses:
      '200':
        description: Cursor-paginated plugin versions without package bytes or download credentials.
        content:
          application/json:
            schema: { $ref: ../common/plugins.yaml#/PluginVersionPage }
      '400': { $ref: ../common/errors.yaml#/ProblemResponse }
      '401': { $ref: ../common/errors.yaml#/ProblemResponse }
      '403': { $ref: ../common/errors.yaml#/ProblemResponse }
      '405': { $ref: ../common/errors.yaml#/MethodNotAllowedProblemResponse }
  post:
    operationId: uploadPluginVersionPackage
    summary: Upload a bounded signed plugin package for streaming verification
    x-dbpilot-permission: plugins:publish
    parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
      - name: Content-Length
        in: header
        required: true
        schema: { type: integer, format: int64, minimum: 1, maximum: 268435456 }
    requestBody:
      required: true
      content:
        application/gzip:
          schema: { type: string, format: binary, minLength: 1, maxLength: 268435456 }
    responses:
      '201':
        description: Registered plugin version metadata.
        headers:
          ETag: { required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        content:
          application/json:
            schema: { $ref: ../common/plugins.yaml#/PluginVersion }
      '400': { $ref: ../common/errors.yaml#/ProblemResponse }
      '401': { $ref: ../common/errors.yaml#/ProblemResponse }
      '403': { $ref: ../common/errors.yaml#/ProblemResponse }
      '405': { $ref: ../common/errors.yaml#/MethodNotAllowedProblemResponse }
      '409': { $ref: ../common/errors.yaml#/ProblemResponse }
      '422': { $ref: ../common/errors.yaml#/ProblemResponse }
