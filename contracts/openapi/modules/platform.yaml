/jobs/{job_id}:
  get:
    operationId: getJob
    summary: Get a job
    x-dbpilot-permission: platform.jobs.read
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: ../common/identifiers.yaml#/JobId
    responses:
      '200':
        description: Job state.
        content:
          application/json:
            schema:
              $ref: ../common/jobs.yaml#/Job
            examples:
              running:
                externalValue: ../../examples/platform/job-running.json
      '400':
        $ref: ../common/errors.yaml#/ProblemResponse
      '401':
        $ref: ../common/errors.yaml#/ProblemResponse
      '403':
        $ref: ../common/errors.yaml#/ProblemResponse
      '404':
        $ref: ../common/errors.yaml#/ProblemResponse
      '405':
        $ref: ../common/errors.yaml#/MethodNotAllowedProblemResponse
/jobs/{job_id}/actions/cancel:
  post:
    operationId: cancelJob
    summary: Request job cancellation
    x-dbpilot-permission: platform.jobs.cancel
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: ../common/identifiers.yaml#/JobId
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: If-Match
        in: header
        required: true
        description: Job entity tag matching the version being cancelled.
        schema:
          type: string
          minLength: 1
    responses:
      '202':
        description: Job cancellation was accepted.
        headers:
          Location:
            required: true
            schema:
              type: string
              format: uri-reference
          ETag:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../common/jobs.yaml#/Job
      '400':
        $ref: ../common/errors.yaml#/ProblemResponse
      '401':
        $ref: ../common/errors.yaml#/ProblemResponse
      '403':
        $ref: ../common/errors.yaml#/ProblemResponse
      '404':
        $ref: ../common/errors.yaml#/ProblemResponse
      '405':
        $ref: ../common/errors.yaml#/MethodNotAllowedProblemResponse
      '409':
        $ref: ../common/errors.yaml#/ProblemResponse
      '412':
        $ref: ../common/errors.yaml#/ProblemResponse
