syntax = "proto3";

package dbpilot.agent.v1;

import "agent/v1/inventory.proto";
import "agent/v1/policy.proto";
import "google/protobuf/timestamp.proto";

option go_package = "dbpilot.local/platform/gen/agent/v1;agentv1";

service AgentControl {
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
}

message AgentMessage {
  string message_id = 1;
  google.protobuf.Timestamp sent_at = 2;
  reserved 3 to 19;

  oneof message {
    Hello hello = 20;
    Heartbeat heartbeat = 21;
    Inventory inventory = 22;
    CommandAcknowledgement command_acknowledgement = 23;
    CommandProgress command_progress = 24;
    CommandResult command_result = 25;
    CommandPrepared command_prepared = 26;
    HostObservation host_observation = 27;
    DiscoveryReport discovery_report = 28;
    PluginObservation plugin_observation = 29;
    CredentialLeaseRequest credential_lease_request = 30;
    PluginArtifactLeaseRequest plugin_artifact_lease_request = 31;
  }

  reserved 32 to 49;
}

message ServerMessage {
  string message_id = 1;
  google.protobuf.Timestamp sent_at = 2;
  reserved 3 to 19;

  oneof message {
    HelloAck hello_ack = 20;
    PolicyUpdate policy_update = 21;
    CommandEnvelope command = 22;
    CommandCancellation command_cancellation = 23;
    FlowControlInstruction flow_control_instruction = 24;
    CommandResultAcknowledgement command_result_acknowledgement = 25;
    CommandStart command_start = 26;
    CredentialLeaseResponse credential_lease_response = 27;
    PluginArtifactLeaseResponse plugin_artifact_lease_response = 28;
    DiscoveryReportAcknowledgement discovery_report_acknowledgement = 50;
  }

  reserved 29 to 49;
}

message DiscoveryReportAcknowledgement {
  string host_id = 1;
  string agent_id = 2;
  uint64 observation_revision = 3;
  bytes report_digest = 4;
  bool persisted = 5;
  bool retryable = 6;
  string reason_code = 7;
}

message Hello {
  string protocol_version = 1;
  string agent_id = 2;
  string agent_version = 3;
  string operating_system = 4;
  string architecture = 5;
  repeated string capabilities = 6;
  repeated string database_adapters = 7;
  repeated CommandRecoveryState active_commands = 8;
}

message HelloAck {
  string protocol_version = 1;
  repeated string capabilities = 2;
  google.protobuf.Timestamp server_time = 3;
}

message Heartbeat {
  string agent_id = 1;
  int64 policy_version = 2;
  uint32 queued_commands = 3;
  uint32 running_commands = 4;
  repeated string active_command_ids = 5;
  repeated ActiveCommand active_commands = 6;
}

message ActiveCommand {
  string command_id = 1;
  bytes execution_token = 2;
  uint64 lease_revision = 3;
}

message CommandEnvelope {
  string command_id = 1;
  string job_id = 2;
  google.protobuf.Timestamp issued_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  bytes nonce = 5;
  bytes signature = 6;
  uint32 lease_seconds = 7;
  string agent_id = 8;
  reserved 9 to 19;

  oneof command {
    CollectNow collect_now = 20;
    InspectInstance inspect_instance = 21;
    ExecuteSQL execute_sql = 22;
    ExecuteRegisteredProcess execute_registered_process = 23;
    CollectDiagnostic collect_diagnostic = 24;
    DiscoverDatabases discover_databases = 25;
    ReconcilePlugin reconcile_plugin = 26;
    ApplyPluginConfiguration apply_plugin_configuration = 27;
    ValidateDatabaseInstance validate_database_instance = 28;
    DrainPlugin drain_plugin = 29;
    CollectDatabaseMetrics collect_database_metrics = 30;
  }

  reserved 31 to 49;
}

message CollectNow {
  repeated string collection_kinds = 1;
  repeated string instance_ids = 2;
}

message InspectInstance {
  string instance_id = 1;
  repeated string inspection_kinds = 2;
}

message ExecuteSQL {
  // Every field is required for an ExecuteSQL command to be valid.
  string instance_id = 1;
  string workorder_id = 2;
  int64 review_revision = 3;
  bytes sql_digest = 4;
  TransactionPolicy transaction_policy = 5;
  uint32 timeout_seconds = 6;
}

message CommandRecoveryState {
  string command_id = 1;
  CommandExecutionState state = 2;
  bytes execution_token = 3;
  uint64 lease_revision = 4;
}

enum CommandExecutionState {
  COMMAND_EXECUTION_STATE_UNSPECIFIED = 0;
  COMMAND_EXECUTION_STATE_ACCEPTED = 1;
  COMMAND_EXECUTION_STATE_RUNNING = 2;
  COMMAND_EXECUTION_STATE_COMPLETED = 3;
  COMMAND_EXECUTION_STATE_PREPARED = 4;
  COMMAND_EXECUTION_STATE_START_AUTHORIZED = 5;
  COMMAND_EXECUTION_STATE_INTERRUPTED = 6;
}

enum TransactionPolicy {
  TRANSACTION_POLICY_UNSPECIFIED = 0;
  TRANSACTION_POLICY_REQUIRED = 1;
  TRANSACTION_POLICY_FORBIDDEN = 2;
  TRANSACTION_POLICY_AUTO_COMMIT = 3;
}

message ExecuteRegisteredProcess {
  string process_id = 1;
  map<string, string> parameters = 2;
}

message CollectDiagnostic {
  string instance_id = 1;
  repeated string diagnostic_kinds = 2;
}

message DiscoverDatabases {
  string host_id = 1;
  uint64 rule_revision = 2;
  bool include_native = 3;
  bool include_docker = 4;
}

message ReconcilePlugin {
  string assignment_id = 1;
  string plugin_id = 2;
  string database_family = 3;
  string desired_version = 4;
  PluginDesiredState desired_state = 5;
  string artifact_id = 6;
  bytes artifact_sha256 = 7;
  bytes manifest_digest = 8;
  uint64 configuration_revision = 9;
  uint64 operation_revision = 10;
  repeated string instance_ids = 11;
  repeated string template_ids = 12;
  reserved 13 to 19;
}

enum PluginDesiredState {
  PLUGIN_DESIRED_STATE_UNSPECIFIED = 0;
  PLUGIN_DESIRED_STATE_ABSENT = 1;
  PLUGIN_DESIRED_STATE_INSTALLED = 2;
  PLUGIN_DESIRED_STATE_RUNNING = 3;
  PLUGIN_DESIRED_STATE_STOPPED = 4;
}

message ApplyPluginConfiguration {
  string assignment_id = 1;
  uint64 configuration_revision = 2;
  repeated PluginInstanceConfiguration instances = 3;
}

message PluginInstanceConfiguration {
  string instance_id = 1;
  string database_variant = 2;
  string endpoint = 3;
  string unix_socket = 4;
  uint64 credential_revision = 5;
  repeated PluginTemplateRevision templates = 6;
}

message PluginTemplateRevision {
  string template_id = 1;
  uint64 revision = 2;
  bytes query_digest = 3;
}

message ValidateDatabaseInstance {
  string assignment_id = 1;
  string instance_id = 2;
  uint64 configuration_revision = 3;
}

message DrainPlugin {
  string assignment_id = 1;
  uint64 operation_revision = 2;
  uint32 timeout_seconds = 3;
}

message CollectDatabaseMetrics {
  string assignment_id = 1;
  uint64 configuration_revision = 2;
  repeated string instance_ids = 3;
  repeated string template_ids = 4;
}

// Credential lease requests and responses exist only on the live AgentControl
// stream. They are never embedded in CommandEnvelope, Job, Outbox or Result.
message CredentialLeaseRequest {
  bytes request_nonce = 1;
  string instance_id = 2;
  string assignment_id = 3;
  uint64 configuration_revision = 4;
}

message CredentialLeaseResponse {
  bytes request_nonce = 1;
  string lease_id = 2;
  string instance_id = 3;
  string assignment_id = 4;
  uint64 credential_revision = 5;
  google.protobuf.Timestamp expires_at = 6;
  CredentialMaterial credential = 7;
}

message CredentialMaterial {
  string username = 1;
  bytes secret_bytes = 2;
}

// Artifact URLs and authorization headers are returned only after command
// execution is fenced by CommandStart and are never persisted in a command.
message PluginArtifactLeaseRequest {
  bytes request_nonce = 1;
  string assignment_id = 2;
  string artifact_id = 3;
  uint64 operation_revision = 4;
}

message PluginArtifactLeaseResponse {
  bytes request_nonce = 1;
  string lease_id = 2;
  string assignment_id = 3;
  string artifact_id = 4;
  uint64 operation_revision = 5;
  google.protobuf.Timestamp expires_at = 6;
  string download_url = 7;
  map<string, string> request_headers = 8;
}

message CommandAcknowledgement {
  string command_id = 1;
  CommandAcknowledgementState state = 2;
  string reason_code = 3;
}

message CommandPrepared {
  string command_id = 1;
  bytes envelope_digest = 2;
}

enum CommandAcknowledgementState {
  COMMAND_ACKNOWLEDGEMENT_STATE_UNSPECIFIED = 0;
  COMMAND_ACKNOWLEDGEMENT_STATE_ACCEPTED = 1;
  COMMAND_ACKNOWLEDGEMENT_STATE_REJECTED = 2;
  COMMAND_ACKNOWLEDGEMENT_STATE_DUPLICATE = 3;
}

message CommandProgress {
  string command_id = 1;
  uint32 percent = 2;
  string stage = 3;
  string message = 4;
  bytes execution_token = 5;
  uint64 lease_revision = 6;
}

message CommandResult {
  string command_id = 1;
  CommandResultState state = 2;
  string summary = 3;
  repeated ArtifactReference artifacts = 4;
  string error_code = 5;
  bytes execution_token = 6;
  uint64 lease_revision = 7;
}

message CommandStart {
  string command_id = 1;
  bytes execution_token = 2;
  uint64 lease_revision = 3;
  uint32 lease_seconds = 4;
  google.protobuf.Timestamp start_deadline = 5;
}

// Sent only after the control plane durably applies the terminal result and
// its idempotent audit evidence. Agents retain results until persisted=true.
message CommandResultAcknowledgement {
  string command_id = 1;
  bool persisted = 2;
  string reason_code = 3;
  bytes result_digest = 4;
  bool retryable = 5;
}

enum CommandResultState {
  COMMAND_RESULT_STATE_UNSPECIFIED = 0;
  COMMAND_RESULT_STATE_SUCCEEDED = 1;
  COMMAND_RESULT_STATE_FAILED = 2;
  COMMAND_RESULT_STATE_CANCELLED = 3;
  COMMAND_RESULT_STATE_TIMED_OUT = 4;
  COMMAND_RESULT_STATE_INTERRUPTED = 5;
}

message ArtifactReference {
  string artifact_id = 1;
  string kind = 2;
  string content_type = 3;
  uint64 size_bytes = 4;
  bytes checksum = 5;
}

message CommandCancellation {
  string command_id = 1;
  string reason = 2;
  bytes execution_token = 3;
  uint64 lease_revision = 4;
}

message FlowControlInstruction {
  uint32 max_in_flight_commands = 1;
  uint32 heartbeat_interval_seconds = 2;
  uint32 retry_after_seconds = 3;
}
