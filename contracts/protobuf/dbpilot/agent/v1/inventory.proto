syntax = "proto3";

package dbpilot.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "dbpilot.local/platform/gen/agent/v1;agentv1";

message Inventory {
  string snapshot_id = 1;
  string agent_id = 2;
  bool full_snapshot = 3;
  repeated InstanceInventory instances = 4;
  google.protobuf.Timestamp observed_at = 5;
}

message InstanceInventory {
  string instance_id = 1;
  string database_type = 2;
  string database_version = 3;
  string endpoint = 4;
  map<string, string> attributes = 5;
}

message HostObservation {
  string host_id = 1;
  string agent_id = 2;
  uint64 observation_revision = 3;
  string hostname = 4;
  string operating_system = 5;
  string operating_system_version = 6;
  string kernel_version = 7;
  string architecture = 8;
  uint32 logical_cpu_count = 9;
  uint64 memory_capacity_bytes = 10;
  repeated FilesystemObservation filesystems = 11;
  repeated string network_addresses = 12;
  repeated string capabilities = 13;
  string agent_version = 14;
  google.protobuf.Timestamp observed_at = 15;
  reserved 16 to 31;
}

message FilesystemObservation {
  string mount_point = 1;
  uint64 capacity_bytes = 2;
  uint64 available_bytes = 3;
}

message DiscoveryReport {
  string host_id = 1;
  string agent_id = 2;
  uint64 observation_revision = 3;
  uint64 rule_revision = 4;
  repeated DiscoveryCandidateObservation candidates = 5;
  google.protobuf.Timestamp observed_at = 6;
  reserved 7 to 19;
}

message DiscoveryCandidateObservation {
  string observation_id = 1;
  DiscoverySource source = 2;
  string database_family = 3;
  string database_variant = 4;
  string version_hint = 5;
  string normalized_endpoint = 6;
  string unix_socket = 7;
  string process_identity = 8;
  string service_name = 9;
  string container_identity = 10;
  string container_image = 11;
  string discovered_role = 12;
  double confidence = 13;
  repeated DiscoveryEvidence evidence = 14;
  bytes fingerprint = 15;
  google.protobuf.Timestamp observed_at = 16;
  reserved 17 to 31;
}

enum DiscoverySource {
  DISCOVERY_SOURCE_UNSPECIFIED = 0;
  DISCOVERY_SOURCE_NATIVE = 1;
  DISCOVERY_SOURCE_DOCKER = 2;
}

message DiscoveryEvidence {
  DiscoveryEvidenceKind kind = 1;
  string redacted_value = 2;
}

enum DiscoveryEvidenceKind {
  DISCOVERY_EVIDENCE_KIND_UNSPECIFIED = 0;
  DISCOVERY_EVIDENCE_KIND_PROCESS_NAME = 1;
  DISCOVERY_EVIDENCE_KIND_EXECUTABLE_PATH = 2;
  DISCOVERY_EVIDENCE_KIND_SYSTEMD_UNIT = 3;
  DISCOVERY_EVIDENCE_KIND_LISTEN_ENDPOINT = 4;
  DISCOVERY_EVIDENCE_KIND_UNIX_SOCKET = 5;
  DISCOVERY_EVIDENCE_KIND_CONTAINER_IMAGE = 6;
  DISCOVERY_EVIDENCE_KIND_CONTAINER_LABEL = 7;
  DISCOVERY_EVIDENCE_KIND_CONTAINER_PORT = 8;
  DISCOVERY_EVIDENCE_KIND_VERSION_HINT = 9;
}

message PluginObservation {
  string host_id = 1;
  string agent_id = 2;
  uint64 observation_revision = 3;
  repeated PluginAssignmentObservation assignments = 4;
  google.protobuf.Timestamp observed_at = 5;
  reserved 6 to 19;
}

message PluginAssignmentObservation {
  string assignment_id = 1;
  string plugin_id = 2;
  string database_family = 3;
  string installed_version = 4;
  PluginActiveSlot active_slot = 5;
  PluginProcessState process_state = 6;
  uint32 process_id = 7;
  google.protobuf.Timestamp started_at = 8;
  PluginHealthState health = 9;
  uint32 restart_count = 10;
  uint32 bound_instance_count = 11;
  uint64 active_configuration_revision = 12;
  uint64 observed_operation_revision = 13;
  string last_error_code = 14;
  google.protobuf.Timestamp observed_at = 15;
  PluginCircuitState circuit_state = 16;
  reserved 17 to 31;
}

enum PluginActiveSlot {
  PLUGIN_ACTIVE_SLOT_UNSPECIFIED = 0;
  PLUGIN_ACTIVE_SLOT_NONE = 1;
  PLUGIN_ACTIVE_SLOT_A = 2;
  PLUGIN_ACTIVE_SLOT_B = 3;
}

enum PluginProcessState {
  PLUGIN_PROCESS_STATE_UNSPECIFIED = 0;
  PLUGIN_PROCESS_STATE_ABSENT = 1;
  PLUGIN_PROCESS_STATE_DOWNLOADING = 2;
  PLUGIN_PROCESS_STATE_VERIFYING = 3;
  PLUGIN_PROCESS_STATE_INSTALLED = 4;
  PLUGIN_PROCESS_STATE_STARTING = 5;
  PLUGIN_PROCESS_STATE_HANDSHAKING = 6;
  PLUGIN_PROCESS_STATE_RUNNING = 7;
  PLUGIN_PROCESS_STATE_DEGRADED = 8;
  PLUGIN_PROCESS_STATE_RESTARTING = 9;
  PLUGIN_PROCESS_STATE_DRAINING = 10;
  PLUGIN_PROCESS_STATE_STOPPED = 11;
  PLUGIN_PROCESS_STATE_UNINSTALLING = 12;
  PLUGIN_PROCESS_STATE_DOWNLOAD_FAILED = 13;
  PLUGIN_PROCESS_STATE_SIGNATURE_REJECTED = 14;
  PLUGIN_PROCESS_STATE_MANIFEST_REJECTED = 15;
  PLUGIN_PROCESS_STATE_PLATFORM_MISMATCH = 16;
  PLUGIN_PROCESS_STATE_START_FAILED = 17;
  PLUGIN_PROCESS_STATE_HANDSHAKE_FAILED = 18;
  PLUGIN_PROCESS_STATE_UPGRADING = 19;
  PLUGIN_PROCESS_STATE_ROLLBACK = 20;
  PLUGIN_PROCESS_STATE_CIRCUIT_OPEN = 21;
}

enum PluginHealthState {
  PLUGIN_HEALTH_STATE_UNSPECIFIED = 0;
  PLUGIN_HEALTH_STATE_HEALTHY = 1;
  PLUGIN_HEALTH_STATE_DEGRADED = 2;
  PLUGIN_HEALTH_STATE_UNHEALTHY = 3;
}

enum PluginCircuitState {
  PLUGIN_CIRCUIT_STATE_UNSPECIFIED = 0;
  PLUGIN_CIRCUIT_STATE_CLOSED = 1;
  PLUGIN_CIRCUIT_STATE_OPEN = 2;
  PLUGIN_CIRCUIT_STATE_HALF_OPEN = 3;
}
