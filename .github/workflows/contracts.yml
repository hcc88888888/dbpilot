name: Contract foundation

on:
  workflow_dispatch:
    inputs:
      run_full_stack:
        description: Run the private-image full-stack Compose acceptance on a prepared Windows runner
        required: false
        type: boolean
        default: false
      run_host_plugin_full_stack:
        description: Run the exact Kylin host and database-plugin production acceptance
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'contracts/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'redocly.yaml'
      - 'backend/api/openapi/**'
      - 'deploy/contracts/**'
      - 'frontend/generated/api/openapi-generator-config.json'
      - 'backend/gen/**'
      - 'frontend/generated/**'
      - 'scripts/contracts/**'
      - 'tests/contracts/**'
      - 'frontend/**'
      - 'backend/**/*.go'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'backend/scripts/**'
      - 'backend/docker/full-stack/**'
      - 'backend/test/e2e/full-stack/**'
      - 'backend/docker/host-plugin-full-stack/**'
      - 'backend/test/e2e/host-plugin-full-stack/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'redocly.yaml'
      - 'backend/api/openapi/**'
      - 'deploy/contracts/**'
      - 'frontend/generated/api/openapi-generator-config.json'
      - 'backend/gen/**'
      - 'frontend/generated/**'
      - 'scripts/contracts/**'
      - 'tests/contracts/**'
      - 'frontend/**'
      - 'backend/**/*.go'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'backend/scripts/**'
      - 'backend/docker/full-stack/**'
      - 'backend/test/e2e/full-stack/**'
      - 'backend/docker/host-plugin-full-stack/**'
      - 'backend/test/e2e/host-plugin-full-stack/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/app/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install locked Node dependencies
        run: npm ci

      - name: Install locked React application dependencies
        run: npm ci --prefix frontend/app

      - name: Install locked legacy full-stack support dependencies
        run: npm ci --prefix backend/test/e2e/full-stack

      - name: Validate full-stack Compose topology
        run: |
          docker compose -f backend/docker/full-stack/docker-compose.yml --profile '*' config --quiet
          docker compose -f backend/docker/host-plugin-full-stack/docker-compose.yml --profile '*' config --quiet

      - name: Run full-stack fake-Docker cleanup contracts
        run: node --test tests/contracts/full-stack-container-safety.test.mjs tests/contracts/host-plugin-full-stack.test.mjs

      - name: Lint canonical contracts
        run: npm run contracts:lint

      - name: Reject breaking Agent contract changes
        run: npm run contracts:breaking

      - name: Reject generated drift
        run: npm run contracts:verify

      - name: Run frontend and contract tests
        run: npm run test:node

      - name: Test and build React management shell
        run: |
          npm run frontend:test
          npm run frontend:build

      - name: Run Go tests on Ubuntu
        working-directory: backend
        run: go test ./... -count=1

      - name: Vet Go integration wiring
        working-directory: backend
        run: go vet ./...

      - name: Run PostgreSQL host inspection lifecycle
        shell: pwsh
        run: ./backend/scripts/verify-host-inspection.ps1

      - name: Run live foundation and Linux verification
        shell: pwsh
        run: ./backend/scripts/verify-contract-foundation.ps1

  full-stack-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_stack == true }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install locked Node dependencies
        run: npm ci

      - name: Run private-image full-stack acceptance
        shell: pwsh
        run: |
          ./backend/scripts/verify-full-stack-compose.ps1 `
            -Image 'cr.kylinos.cn/kylin/kylin-server-platform:v10sp1' `
            -Architecture amd64 `
            -GoBinary (Get-Command go).Source

  host-plugin-full-stack-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_host_plugin_full_stack == true }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/app/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix frontend/app

      - name: Run exact Kylin host-plugin production acceptance
        shell: pwsh
        run: |
          ./backend/scripts/verify-host-plugin-full-stack.ps1 `
            -KylinImage 'cr.kylinos.cn/kylin/kylin-server-platform:v10sp1' `
            -Architecture amd64 `
            -GoBinary (Get-Command go).Source
